<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadi Photo Studio - Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
<style> body { font-family: 'Jameel Noori Nastaleeq', 'Arial', sans-serif; } </style>
</head>
<body class="bg-gray-100">

<!-- Booking Form -->
<div class="max-w-2xl mx-auto p-6 mt-10 bg-white rounded-2xl shadow-lg">
  <h1 class="text-3xl font-bold text-center mb-6">Hadi Photo Studio - Booking</h1>
  
  <form id="bookingForm" class="space-y-4">
    <input type="text" id="name" placeholder="نام" required class="w-full p-3 border rounded-lg">
    <input type="tel" id="phone" placeholder="فون نمبر" required class="w-full p-3 border rounded-lg">
    <input type="date" id="date" required class="w-full p-3 border rounded-lg">
    <select id="service" class="w-full p-3 border rounded-lg">
      <option>Wedding Photography</option>
      <option>Portrait Shoot</option>
      <option>Event Coverage</option>
    </select>
    <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">Booking Confirm کریں</button>
  </form>
  <p id="msg" class="text-center mt-4 text-green-600"></p>
</div>

<!-- Admin Panel Link -->
<div class="text-center mt-4">
  <button onclick="adminLogin()" class="text-blue-600 underline">Admin Panel</button>
</div>

<!-- Admin Panel -->
<div id="adminPanel" class="hidden max-w-4xl mx-auto p-6 mt-10 bg-white rounded-2xl shadow-lg">
  <h2 class="text-2xl font-bold mb-4">All Bookings</h2>
  <div id="bookingsList"></div>
</div>


<script type="module">
// 1. Firebase Import
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 2. آپ کی Firebase Keys
const firebaseConfig = {
  apiKey: "AIzaSyADeKuuDTLTFnQv_bEQOJoLd5FIwqV7moA",
  authDomain: "hadi-photo-studio.firebaseapp.com",
  projectId: "hadi-photo-studio",
  storageBucket: "hadi-photo-studio.firebasestorage.app",
  messagingSenderId: "824618721871",
  appId: "1:824618721871:web:73bab971344b934b45803a",
  measurementId: "G-NKVTJPR90F"
};

// 3. Firebase Start
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 4. Booking Submit
const form = document.getElementById('bookingForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  await addDoc(collection(db, "bookings"), {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    date: document.getElementById('date').value,
    service: document.getElementById('service').value,
    timestamp: new Date()
  });
  document.getElementById('msg').innerText = "آپ کی Booking Submit ہو گئی ہے!";
  form.reset();
});

// 5. Admin Panel
async function loadBookings() {
  const q = query(collection(db, "bookings"), orderBy("timestamp", "desc"));
  const querySnapshot = await getDocs(q);
  let html = "";
  querySnapshot.forEach((doc) => {
    const b = doc.data();
    html += `<div class="border p-3 mb-2 rounded-lg">
      <b>نام:</b> ${b.name} <br>
      <b>فون:</b> ${b.phone} <br>
      <b>تاریخ:</b> ${b.date} <br>
      <b>سروس:</b> ${b.service}
    </div>`;
  });
  document.getElementById('bookingsList').innerHTML = html;
}

function adminLogin() {
  const pass = prompt("Admin Password ڈالیں: 1234");
  if(pass === "1234") {
    document.getElementById('adminPanel').classList.remove('hidden');
    loadBookings();
  }
}
</script>
</body>
</html>
